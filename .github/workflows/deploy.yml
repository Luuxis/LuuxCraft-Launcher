name: 'publish'

# Une release du launcher porte deux lignes de produit :
#
#   moteur      l'application tauri générique, en artefact **portable** —
#               exe-zip (windows), app-tar-gz (darwin), appimage (linux)
#   bootstrap   l'installeur Windows de première mise en place, publié vierge
#
# Aucun installeur d'OS n'est produit, ni msi, ni nsis, ni dmg, ni deb, ni rpm :
# un installeur écrirait dans Program Files ou /opt, alors que chaque client
# doit pouvoir vivre dans son propre dossier.
#
# **Rien n'est compilé par client.** Le moteur est identique pour tous et servi
# tel quel ; le bootstrap est publié sans identité, et c'est le panel qui en
# tire une copie par client en remplissant son créneau de 87 octets. Une
# compilation par (OS, architecture), donc, et pas une de plus.
#
# Aucune release GitHub n'est créée : les octets vivent dans le R2 du panel.
#
# À configurer une fois sur le dépôt :
#   Variables  PANEL_URL        https://luuxcraft.fr
#   Secrets    PANEL_BUILD_KEY  Admin → Configuration → Builds du launcher
#
# Aucune clé de signature n'est nécessaire : personne n'en vérifierait une.
# L'intégrité tient au SHA-256 calculé sur les octets téléversés ici, que le
# panel publie dans son manifeste.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Canal de diffusion'
        type: choice
        options: ['stable', 'beta']
        default: 'stable'
      notes:
        description: 'Notes de version montrées dans le launcher'
        type: string
        default: ''
      publish:
        description: 'Publier à la fin (sinon la release reste en préparation)'
        type: boolean
        default: true
  push:
    tags: ['v*']

# Rien n'écrit dans le dépôt : aucune release GitHub n'est créée, les artefacts
# partent vers le panel.
permissions:
  contents: read

concurrency:
  # Une version à la fois : deux exécutions concurrentes sur la même version se
  # marcheraient sur les pieds au moment de publier.
  group: launcher-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PANEL_URL: ${{ vars.PANEL_URL }}
  PANEL_BUILD_KEY: ${{ secrets.PANEL_BUILD_KEY }}

jobs:
  # La release doit exister avant que les jobs de build n'y rattachent leurs
  # artefacts.
  open-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.open.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: open the release on the panel
        id: open
        env:
          RELEASE_CHANNEL: ${{ inputs.channel || 'stable' }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          node .github/scripts/panel-release.mjs open
          echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

  # Le moteur générique, en artefact portable sur les trois OS : ces octets
  # doivent pouvoir être déployés par simple recopie, sans installeur. D'où
  # `--no-bundle` sous Windows — un `-setup.exe` NSIS est un installeur, il irait
  # écrire dans Program Files, hors de l'isolation par client.
  engine:
    needs: open-release
    strategy:
      # Sans fail-fast, une plateforme qui casse laisse les autres finir : la
      # release reste en préparation et il suffit de rejouer le job fautif.
      fail-fast: false
      matrix:
        include:
          # `target` et `arch` sont les créneaux du manifeste du panel : c'est
          # sous ces valeurs exactes qu'un artefact y est rangé, puis retrouvé.
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin --bundles app'
            target: 'darwin'
            arch: 'aarch64'
            # Avec `--target`, tauri range le bundle sous ce triplet plutôt que
            # sous `release/` : l'étape d'empaquetage a besoin du chemin exact.
            triple: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin --bundles app'
            target: 'darwin'
            arch: 'x86_64'
            triple: 'x86_64-apple-darwin'
          - platform: 'ubuntu-latest'
            args: '--bundles appimage'
            target: 'linux'
            arch: 'x86_64'
            triple: ''
          - platform: 'windows-latest'
            args: '--no-bundle'
            target: 'windows'
            arch: 'x86_64'
            triple: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # Deux jobs macOS partagent le runner mais pas la cible : sans clé
          # distincte, ils s'écrasent mutuellement le cache.
          key: engine-${{ matrix.target }}-${{ matrix.arch }}

      - name: install frontend dependencies
        run: npm install

      - name: build the engine
        shell: bash
        run: npm run tauri build -- ${{ matrix.args }}

      # Un seul fichier par plateforme, portable, prêt à être servi tel quel.
      # L'emballage se fait ici plutôt que dans le bundler tauri : ce qu'il sait
      # produire, ce sont des installeurs d'OS, alors qu'il faut une archive qui
      # se déballe simplement dans un dossier.
      - name: package the engine
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Le nom de produit porte une espace (« LuuxCraft Launcher ») et n'a
          # pas à être recopié ici : il est lu là où tauri le lit.
          product=$(node -p "require('./src-tauri/tauri.conf.json').productName")
          # Sans `--target`, tauri construit sous `target/release/` ; avec, sous
          # `target/<triplet>/release/`.
          out="src-tauri/target${TRIPLE:+/$TRIPLE}/release"

          case "$TARGET" in
            windows)
              # `--no-bundle` laisse l'exécutable brut : `bundle.resources` est
              # vide, il se suffit à lui-même.
              #
              # Cet exécutable-là porte le nom du paquet cargo
              # (`luuxcraft-launcher.exe`), pas le nom de produit : tauri ne
              # renomme qu'en empaquetant, et on n'empaquette plus. Plutôt que de
              # recopier l'un ou l'autre ici, on prend le seul `.exe` du dossier —
              # cargo range tout le reste dans des sous-dossiers.
              shopt -s nullglob
              exes=("$out"/*.exe)
              [ "${#exes[@]}" -eq 1 ] || { echo "::error::attendu un exécutable dans $out, trouvé ${#exes[@]}"; exit 1; }
              # Renommé au nom de produit : c'est ce que le joueur lira dans le
              # gestionnaire de tâches et dans la cible de son raccourci.
              mkdir -p stage
              cp "${exes[0]}" "stage/$product.exe"
              artifact="dist/engine-windows-$ARCH.zip"
              # Le zip ne contient que lui, à la racine — d'où le `cd`, sinon
              # 7-Zip y recopierait toute l'arborescence de `stage`.
              (cd stage && 7z a -tzip -mx=9 "../$artifact" "$product.exe" > /dev/null)
              ;;
            darwin)
              # Le `.app` est une arborescence : il faut un fichier unique pour
              # le téléverser. `tar` préserve les permissions Unix, condition
              # pour que le Mach-O reste exécutable après déballage.
              app="$out/bundle/macos/$product.app"
              [ -d "$app" ] || { echo "::error::bundle introuvable : $app"; exit 1; }
              artifact="dist/engine-darwin-$ARCH.app.tar.gz"
              # Sans COPYFILE_DISABLE, le tar de macOS ajoute les forks de
              # ressources sous forme d'entrées `._*` que les autres outils
              # déballent en fichiers parasites dans le bundle.
              COPYFILE_DISABLE=1 tar -czf "$artifact" -C "$(dirname "$app")" "$product.app"
              ;;
            linux)
              # L'AppImage est déjà un exécutable portable d'un seul fichier :
              # rien à empaqueter, on le sert tel quel.
              shopt -s nullglob
              images=("$out/bundle/appimage/"*.AppImage)
              [ "${#images[@]}" -eq 1 ] || { echo "::error::attendu un AppImage, trouvé ${#images[@]}"; exit 1; }
              artifact="${images[0]}"
              ;;
            *)
              echo "::error::plateforme inconnue : $TARGET"; exit 1 ;;
          esac

          ls -l "$artifact"
          # En JSON : le nom d'un AppImage produit par tauri contient une espace.
          node -e 'process.stdout.write("paths="+JSON.stringify([process.argv[1]])+"\n")' "$artifact" >> "$GITHUB_OUTPUT"

      - name: upload the engine to the panel
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.package.outputs.paths }}
          ARTIFACT_TARGET: ${{ matrix.target }}
          ARTIFACT_ARCH: ${{ matrix.arch }}
        run: node .github/scripts/panel-release.mjs upload

  # Le bootstrap Windows : l'installeur de première mise en place, publié
  # **vierge**. Le panel en tirera une copie par client en remplissant son
  # créneau d'identité (87 octets repérés par une chaîne magique, voir
  # `bootstrap/src/identity.rs`).
  #
  # Windows seulement : Linux et macOS s'installent par la commande
  # `curl … | sh` que le panel sert, qui n'a rien à télécharger d'abord.
  bootstrap:
    needs: open-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './bootstrap -> target'
          key: bootstrap-windows-x86_64

      # L'adresse du panel est la seule chose compilée dans ce binaire : le
      # créneau ne porte que l'identifiant du client (voir `bootstrap/src/config.rs`).
      - name: build the bootstrap
        shell: bash
        env:
          LUUXCRAFT_PANEL_URL: ${{ vars.PANEL_URL }}
        run: cargo build --release --manifest-path bootstrap/Cargo.toml

      # Le panel cherche le créneau par sa chaîne magique et **refuse de
      # publier** s'il en trouve zéro ou plusieurs. Le vérifier ici fait échouer
      # le build plutôt qu'un téléchargement, des semaines plus tard.
      - name: check the identity slot
        shell: bash
        run: |
          set -euo pipefail
          exe=bootstrap/target/release/luuxcraft-bootstrap.exe
          [ -f "$exe" ] || { echo "::error::binaire introuvable : $exe"; exit 1; }
          node -e '
            const fs = require("node:fs");
            const magic = Buffer.from("LXCBOOTSTRAP-TENANT-V1");
            const bytes = fs.readFileSync(process.argv[1]);
            let count = 0;
            for (let at = bytes.indexOf(magic); at !== -1; at = bytes.indexOf(magic, at + 1)) count++;
            if (count !== 1) {
              console.error(`::error::créneau d\x27identité trouvé ${count} fois, attendu exactement 1`);
              process.exit(1);
            }
            console.log("créneau d\x27identité : 1 occurrence, injectable");
          ' "$exe"

      - name: name the bootstrap
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # Le nom est décoratif : le panel le remplace par celui du client au
          # téléchargement, et le bootstrap lit son identité dans sa propre
          # mémoire, jamais dans son nom de fichier.
          artifact="dist/bootstrap-windows-x86_64.exe"
          cp bootstrap/target/release/luuxcraft-bootstrap.exe "$artifact"
          ls -l "$artifact"
          node -e 'process.stdout.write("paths="+JSON.stringify([process.argv[1]])+"\n")' "$artifact" >> "$GITHUB_OUTPUT"

      - name: upload the bootstrap to the panel
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.package.outputs.paths }}
          ARTIFACT_TARGET: 'windows'
          ARTIFACT_ARCH: 'x86_64'
        run: node .github/scripts/panel-release.mjs upload

  # C'est `needs` qui donne le « tout ou rien » : un seul job de build en échec
  # ne publie rien. Le panel, lui, refuse en plus un artefact dont les octets
  # manquent.
  publish-release:
    # `open-release` est dans les besoins pour son `outputs.version`, repris
    # dans le résumé.
    needs: [open-release, engine, bootstrap]
    # Un push de tag publie toujours. Le test ne peut pas s'écrire
    # `inputs.publish != false` : hors `workflow_dispatch` l'entrée est nulle,
    # et GitHub convertit `null` et `false` en 0 — la comparaison serait fausse
    # et un tag ne publierait jamais rien.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: publish the release
        run: node .github/scripts/panel-release.mjs publish

      - name: summary
        run: |
          {
            echo "### Launcher ${{ needs.open-release.outputs.version }} publié"
            echo
            echo "Canal : \`${{ inputs.channel || 'stable' }}\`"
            echo
            echo "Première installation :"
            echo
            echo "- **Windows** — \`/api/v1/launchers/<id du tenant>/bootstrap?os=windows\`,"
            echo "  l'installeur au nom du client (le panel remplit son créneau d'identité à la"
            echo "  première demande, puis sert le même fichier à tout le monde)."
            echo "- **Linux et macOS** — \`curl -fsSL <panel>/api/v1/launchers/<id>/install.sh | sh\`."
            echo
            echo "Les launchers déjà installés récupèrent cette version tout seuls : le moteur"
            echo "compare sa version à celle du manifeste au démarrage et remplace son propre"
            echo "exécutable, sans jamais toucher au pack client ni aux données du joueur."
          } >> "$GITHUB_STEP_SUMMARY"
