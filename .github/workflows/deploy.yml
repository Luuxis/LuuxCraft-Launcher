name: 'publish'

# Une release du launcher porte deux lignes de produit, et rien d'autre :
#
#   bootstrap  l'installeur figé (`bootstrap-installer/`), un binaire par OS.
#              C'est le seul fichier qu'un joueur télécharge. Il ne contient
#              aucune identité : le panel lui ajoute 32 octets au téléchargement
#              pour lui dire de quel tenant il s'agit.
#   engine     le moteur tauri générique, publié en artefact **portable** :
#              exe-zip (windows), app-tar-gz (darwin), appimage (linux). Aucun
#              installeur d'OS n'est produit — ni msi, ni nsis, ni dmg, ni deb,
#              ni rpm : un installeur écrirait dans Program Files ou /opt, alors
#              que le moteur doit atterrir dans le dossier du tenant, posé là
#              par le bootstrap.
#
# Rien n'est compilé par client, et aucune release GitHub n'est créée : les
# octets vivent dans le R2 du panel, qui les sert.
#
# À configurer une fois sur le dépôt :
#   Variables  PANEL_URL        https://luuxcraft.fr
#   Secrets    PANEL_BUILD_KEY  Admin → Configuration → Builds du launcher
#
# Aucune clé de signature n'est nécessaire : personne n'en vérifierait une. Le
# moteur est mis à jour par le bootstrap — cible du raccourci, donc exécuté à
# chaque lancement — qui compare le SHA-256 du moteur au manifeste du panel et
# le remplace si besoin. L'intégrité tient à cette empreinte, calculée sur les
# octets téléversés ici.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Canal de diffusion'
        type: choice
        options: ['stable', 'beta']
        default: 'stable'
      notes:
        description: 'Notes de version montrées dans le launcher'
        type: string
        default: ''
      publish:
        description: 'Publier à la fin (sinon la release reste en préparation)'
        type: boolean
        default: true
  push:
    tags: ['v*']

# Rien n'écrit dans le dépôt : aucune release GitHub n'est créée, les artefacts
# partent vers le panel.
permissions:
  contents: read

concurrency:
  # Une version à la fois : deux exécutions concurrentes sur la même version se
  # marcheraient sur les pieds au moment de publier.
  group: launcher-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PANEL_URL: ${{ vars.PANEL_URL }}
  PANEL_BUILD_KEY: ${{ secrets.PANEL_BUILD_KEY }}

jobs:
  # La release doit exister avant que les jobs de build n'y rattachent leurs
  # artefacts.
  open-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.open.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: open the release on the panel
        id: open
        env:
          RELEASE_CHANNEL: ${{ inputs.channel || 'stable' }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          node .github/scripts/panel-release.mjs open
          echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

  # L'installeur figé : un binaire par OS, sans interface ni webview, donc sans
  # les dépendances système du moteur.
  bootstrap:
    needs: open-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'windows'
            arch: 'x86_64'
            triples: 'host'
            artifact: 'bootstrap-windows-x86_64.exe'
          - platform: 'ubuntu-latest'
            target: 'linux'
            arch: 'x86_64'
            triples: 'host'
            artifact: 'bootstrap-linux-x86_64.bin'
          # La route de téléchargement ne connaît que l'OS, jamais
          # l'architecture : un Mac Intel et un Mac Apple Silicon reçoivent le
          # même fichier, qui doit donc être universel.
          - platform: 'macos-latest'
            target: 'darwin'
            arch: 'universal'
            triples: 'x86_64-apple-darwin aarch64-apple-darwin'
            artifact: 'bootstrap-darwin-universal.bin'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      # Aucune dépendance système à installer : le bootstrap n'embarque ni
      # webview ni TLS système (rustls), c'est tout l'intérêt d'un crate séparé.
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'darwin' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './bootstrap-installer -> target'
          key: bootstrap-${{ matrix.target }}

      - name: build the bootstrap
        shell: bash
        env:
          TRIPLES: ${{ matrix.triples }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          mkdir -p dist
          exes=()
          for triple in $TRIPLES; do
            args=(build --release --manifest-path bootstrap-installer/Cargo.toml --message-format json-render-diagnostics)
            if [ "$triple" != host ]; then args+=(--target "$triple"); fi
            cargo "${args[@]}" > "cargo-$triple.json"
            # Le chemin du binaire est lu dans les messages de cargo plutôt que
            # deviné : le nom du paquet, celui de la cible et le triplet
            # n'appartiennent pas à ce workflow.
            exe=$(node -e 'const lines=require("node:fs").readFileSync(process.argv[1],"utf8").split(/\r?\n/).filter(Boolean);const hit=lines.map(l=>JSON.parse(l)).filter(m=>m.reason==="compiler-artifact"&&m.executable).pop();if(!hit){console.error("aucun executable produit par cargo");process.exit(1)}process.stdout.write(hit.executable)' "cargo-$triple.json")
            # Sous Windows cargo renvoie un chemin à antislashs, que les outils
            # MSYS de `shell: bash` ne suivent pas.
            exes+=("${exe//\\//}")
          done
          if [ "${#exes[@]}" -gt 1 ]; then
            lipo -create -output "dist/$ARTIFACT" "${exes[@]}"
          else
            cp "${exes[0]}" "dist/$ARTIFACT"
          fi
          ls -l "dist/$ARTIFACT"

      - name: upload the bootstrap to the panel
        shell: bash
        env:
          ARTIFACT_PATHS: '["dist/${{ matrix.artifact }}"]'
          ARTIFACT_ROLE: 'bootstrap'
          ARTIFACT_TARGET: ${{ matrix.target }}
          ARTIFACT_ARCH: ${{ matrix.arch }}
        run: node .github/scripts/panel-release.mjs upload

  # Le moteur générique, en artefact portable sur les trois OS : c'est le
  # bootstrap qui pose ces octets dans le dossier du tenant, aucun installeur
  # n'intervient. D'où `--no-bundle` sous Windows — un `-setup.exe` NSIS est un
  # installeur, il irait écrire dans Program Files, hors de l'isolation par
  # tenant.
  engine:
    needs: open-release
    strategy:
      # Sans fail-fast, une plateforme qui casse laisse les autres finir : la
      # release reste en préparation et il suffit de rejouer le job fautif.
      fail-fast: false
      matrix:
        include:
          # `target` et `arch` sont les créneaux du manifeste du panel : le
          # bootstrap demande le sien et le panel doit y trouver exactement ces
          # valeurs.
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin --bundles app'
            target: 'darwin'
            arch: 'aarch64'
            # Avec `--target`, tauri range le bundle sous ce triplet plutôt que
            # sous `release/` : l'étape d'empaquetage a besoin du chemin exact.
            triple: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin --bundles app'
            target: 'darwin'
            arch: 'x86_64'
            triple: 'x86_64-apple-darwin'
          - platform: 'ubuntu-latest'
            args: '--bundles appimage'
            target: 'linux'
            arch: 'x86_64'
            triple: ''
          - platform: 'windows-latest'
            args: '--no-bundle'
            target: 'windows'
            arch: 'x86_64'
            triple: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # Deux jobs macOS partagent le runner mais pas la cible : sans clé
          # distincte, ils s'écrasent mutuellement le cache.
          key: engine-${{ matrix.target }}-${{ matrix.arch }}

      - name: install frontend dependencies
        run: npm install

      - name: build the engine
        shell: bash
        run: npm run tauri build -- ${{ matrix.args }}

      # Un seul fichier par plateforme, portable, prêt à être posé tel quel par
      # le bootstrap. L'emballage se fait ici plutôt que dans le bundler tauri :
      # ce qu'il sait produire, ce sont des installeurs d'OS, et le bootstrap a
      # besoin d'une archive qu'il puisse simplement extraire dans le dossier du
      # tenant.
      - name: package the engine
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Le nom de produit porte une espace (« LuuxCraft Launcher ») et n'a
          # pas à être recopié ici : il est lu là où tauri le lit.
          product=$(node -p "require('./src-tauri/tauri.conf.json').productName")
          # Sans `--target`, tauri construit sous `target/release/` ; avec, sous
          # `target/<triplet>/release/`.
          out="src-tauri/target${TRIPLE:+/$TRIPLE}/release"

          case "$TARGET" in
            windows)
              # `--no-bundle` laisse l'exécutable brut : `bundle.resources` est
              # vide, il se suffit à lui-même. Le zip ne contient que lui, à la
              # racine — d'où le `cd`, sinon 7-Zip y recopierait toute
              # l'arborescence `src-tauri/target/release/`.
              exe="$out/$product.exe"
              [ -f "$exe" ] || { echo "::error::exécutable introuvable : $exe"; exit 1; }
              mkdir -p stage
              cp "$exe" "stage/$product.exe"
              artifact="dist/engine-windows-$ARCH.zip"
              (cd stage && 7z a -tzip -mx=9 "../$artifact" "$product.exe" > /dev/null)
              ;;
            darwin)
              # Le `.app` est une arborescence : il faut un fichier unique pour
              # le téléverser. `tar` préserve les permissions Unix, condition
              # pour que le Mach-O reste exécutable après déballage.
              app="$out/bundle/macos/$product.app"
              [ -d "$app" ] || { echo "::error::bundle introuvable : $app"; exit 1; }
              artifact="dist/engine-darwin-$ARCH.app.tar.gz"
              # Sans COPYFILE_DISABLE, le tar de macOS ajoute les forks de
              # ressources sous forme d'entrées `._*` que les autres outils
              # déballent en fichiers parasites dans le bundle.
              COPYFILE_DISABLE=1 tar -czf "$artifact" -C "$(dirname "$app")" "$product.app"
              ;;
            linux)
              # L'AppImage est déjà un exécutable portable d'un seul fichier :
              # rien à empaqueter, on le sert tel quel.
              shopt -s nullglob
              images=("$out/bundle/appimage/"*.AppImage)
              [ "${#images[@]}" -eq 1 ] || { echo "::error::attendu un AppImage, trouvé ${#images[@]}"; exit 1; }
              artifact="${images[0]}"
              ;;
            *)
              echo "::error::plateforme inconnue : $TARGET"; exit 1 ;;
          esac

          ls -l "$artifact"
          # En JSON : le nom d'un AppImage produit par tauri contient une espace.
          node -e 'process.stdout.write("paths="+JSON.stringify([process.argv[1]])+"\n")' "$artifact" >> "$GITHUB_OUTPUT"

      - name: upload the engine to the panel
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.package.outputs.paths }}
          ARTIFACT_ROLE: 'engine'
          ARTIFACT_TARGET: ${{ matrix.target }}
          ARTIFACT_ARCH: ${{ matrix.arch }}
        run: node .github/scripts/panel-release.mjs upload

  # C'est `needs` qui donne le « tout ou rien » : un seul job de build en échec
  # ne publie rien. Le panel, lui, refuse en plus un artefact dont les octets
  # manquent.
  publish-release:
    # `open-release` est dans les besoins pour son `outputs.version`, repris
    # dans le résumé.
    needs: [open-release, bootstrap, engine]
    # Un push de tag publie toujours. Le test ne peut pas s'écrire
    # `inputs.publish != false` : hors `workflow_dispatch` l'entrée est nulle,
    # et GitHub convertit `null` et `false` en 0 — la comparaison serait fausse
    # et un tag ne publierait jamais rien.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: publish the release
        run: node .github/scripts/panel-release.mjs publish

      - name: summary
        run: |
          {
            echo "### Launcher ${{ needs.open-release.outputs.version }} publié"
            echo
            echo "Canal : \`${{ inputs.channel || 'stable' }}\`"
            echo
            echo "Les launchers installés remplaceront leur moteur au prochain lancement : le bootstrap"
            echo "compare le SHA-256 publié à celui du moteur posé chez le joueur."
            echo
            echo "Les nouveaux téléchargements passent par"
            echo "\`/api/v1/launchers/<id du tenant>/download?os=windows|linux|macos\`,"
            echo "qui sert le bootstrap figé avec l'overlay du tenant."
          } >> "$GITHUB_STEP_SUMMARY"
