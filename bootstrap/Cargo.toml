[package]
name = "luuxcraft-bootstrap"
version = "1.0.0"
description = "Installeur Windows LuuxCraft : lit son créneau d'identité, installe le moteur et le pack client, puis le lance."
authors = ["Luuxis"]
edition = "2021"
publish = false

# Crate volontairement autonome : il n'appartient pas au workspace de
# `src-tauri/`. Le bootstrap est compilé une fois par (OS, arch) puis figé dans
# R2 ; il ne doit rien partager avec le moteur, ni tauri, ni webview, sinon le
# binaire servi à chaque joueur pèserait des dizaines de méga-octets.
[workspace]

[[bin]]
name = "luuxcraft-bootstrap"
path = "src/main.rs"

[dependencies]
# `ureq` plutôt que `reqwest` : bloquant, sans runtime asynchrone, TLS rustls
# embarqué avec ses propres racines — un installeur ne doit dépendre ni de
# tokio ni du magasin de certificats du système.
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
dirs = "5"
# Le moteur Windows voyage dans un zip contenant l'exécutable nu. C'est le seul
# format que ce bootstrap décode : `app-tar-gz` et `appimage` appartiennent aux
# plateformes installées par le script `sh`, et embarquer leurs décodeurs ne
# ferait qu'alourdir un binaire que le joueur télécharge en premier.
zip = { version = "2", default-features = false, features = ["deflate"] }

# L'interface est du Win32 natif : une fenêtre, quelques contrôles standard,
# GDI+ pour afficher le logo. `windows-sys` n'est que des déclarations — seules
# les fonctions appelées entrent dans le binaire, qui reste minuscule.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Ne sert qu'au script de build, pour tirer l'icône de l'exécutable de
# `logo/logo.png` : décodage du PNG et mise à l'échelle. Rien de tout cela
# n'entre dans le binaire.
[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
