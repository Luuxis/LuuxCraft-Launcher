[package]
name = "luuxcraft-launcher"
version = "1.0.0"
description = "LuuxCraft Minecraft launcher"
authors = ["Luuxis"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "luuxcraft_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `image-png` : `Image::from_bytes` sert à poser le logo du client sur la
# fenêtre au démarrage (voir `src/branding.rs`). Sans cette option, tauri ne
# sait décoder aucun format d'image.
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crust_core = "1.0.3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
tauri-plugin-process = "2.3.1"
tauri-plugin-log = "2.9.1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-window-state = "2.4.1"
log = "0.4"
thiserror = "2"
base64 = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
url = "2"
# Empreintes SHA-256 : l'intégrité du moteur téléchargé par `update.rs`, et la
# clé qui relie un bundle macOS à son pack client (`client_config.rs`).
sha2 = "0.10"

# Le moteur se met à jour lui-même (voir `src/update.rs`), et chaque plateforme
# a un seul format de bundle. Déclarer les décodeurs par cible évite d'emporter
# dans l'AppImage Linux ce dont seuls Windows et macOS ont besoin.
[target.'cfg(target_os = "windows")'.dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
flate2 = "1"
tar = "0.4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
