[package]
name = "luuxcraft-launcher"
version = "1.0.0"
description = "LuuxCraft Minecraft launcher"
authors = ["Luuxis"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "luuxcraft_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crust_core = "1.0.3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-log = "2.9.1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-window-state = "2.4.1"
log = "0.4"
thiserror = "2"
base64 = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
url = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
